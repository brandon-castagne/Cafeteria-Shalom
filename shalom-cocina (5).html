<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shalom — Cocina</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A1A1A; --card: #252525; --card2: #2E2E2E;
    --green: #1D9E75; --green-light: rgba(29,158,117,0.15);
    --text: #F0EFE8; --muted: #888; --border: rgba(255,255,255,0.08);
    --red: #E24B4A; --red-light: rgba(226,75,74,0.15);
    --orange: #E8943A; --orange-light: rgba(232,148,58,0.15);
    --r: 12px; --rs: 8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100%; height: -webkit-fill-available; }

  .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .topbar h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .logo-pill { background: var(--green); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .pend-count { background: var(--red); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }

  .refresh-bar { background: var(--card2); border-bottom: 1px solid var(--border); padding: 7px 16px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .refresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .refresh-btn-small { margin-left: auto; background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; padding: 4px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; }

  .tab-bar { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tab { padding: 12px; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; font-family: 'DM Sans', sans-serif; }
  .tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }

  .orders-list { flex: 1; overflow-y: auto; padding: 10px 12px; -webkit-overflow-scrolling: touch; min-height: 0; }

  .order-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 13px; margin-bottom: 9px; }
  .order-card.pendiente { border-left: 3px solid var(--green); }
  .order-card.done { opacity: 0.45; }
  .order-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .order-num { background: var(--green); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .order-client { font-size: 14px; font-weight: 600; flex: 1; }
  .order-time { font-size: 11px; color: var(--muted); }
  .order-items { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 9px; }
  .order-total { font-size: 14px; font-weight: 600; margin-bottom: 10px; }

  .btn-complete { width: 100%; background: var(--green-light); border: 1px solid var(--green); border-radius: var(--rs); padding: 11px; font-size: 13px; font-weight: 600; color: var(--green); cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-complete:disabled { opacity: 0.6; }
  .btn-reabrir { width: 100%; background: var(--orange-light); border: 1px solid var(--orange); border-radius: var(--rs); padding: 11px; font-size: 13px; font-weight: 600; color: var(--orange); cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 6px; }
  .btn-reabrir:disabled { opacity: 0.6; }

  .empty-msg { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; line-height: 1.8; }
  .empty-icon { font-size: 38px; display: block; margin-bottom: 10px; }
  .spinner-wrap { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }
  .spinner { width: 26px; height: 26px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MODAL CERRAR DÍA */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card2); border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 340px; }
  .modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-cancel { background: none; border: 1px solid var(--border); border-radius: var(--rs); padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; color: var(--text); }
  .btn-cerrar-dia { background: var(--red); border: none; border-radius: var(--rs); padding: 12px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-cerrar-dia:disabled { opacity: 0.6; }

  #toast { position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(8px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .btn-dia { background: none; border: 1px solid var(--red); border-radius: 8px; color: var(--red); font-size: 11px; font-weight: 600; padding: 4px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="logo-pill">SH82</span>
    <h1>Cocina</h1>
    <span class="pend-count" id="pend-count" style="display:none;">0</span>
    <button class="btn-dia" onclick="abrirModalDia()">Cerrar día</button>
  </div>

  <div class="refresh-bar">
    <span class="refresh-dot"></span>
    <span id="refresh-label">Conectando...</span>
    <button class="refresh-btn-small" onclick="loadOrders(true)">🔄 Actualizar</button>
  </div>

  <div class="tab-bar">
    <button class="tab active" id="tab-pend" onclick="switchTab('Pendiente')">🕐 Pendientes</button>
    <button class="tab" id="tab-done" onclick="switchTab('Completado')">✅ Completados</button>
  </div>

  <div class="orders-list" id="orders-list">
    <div class="spinner-wrap"><div class="spinner"></div>Cargando pedidos...</div>
  </div>
</div>

<!-- MODAL CERRAR DÍA -->
<div class="modal-overlay" id="modal-dia">
  <div class="modal">
    <h2>📅 Cerrar el día</h2>
    <p>Los pedidos de hoy se guardarán en una hoja separada con la fecha de hoy. La hoja <strong>HOY</strong> quedará vacía para el nuevo día.</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-cerrar-dia" id="btn-confirmar-dia" onclick="cerrarDia()">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_SWEGDqpE5MFn4J_thnWDhidGkBJSsAmjSOREv-fT2wjALa9pyzQdVhH-xrcKRyQ/exec';

let allOrders = [];
let currentTab = 'Pendiente';

function jsonp(url, cb) {
  const name = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*9999);
  const s = document.createElement('script');
  const timer = setTimeout(function() {
    if (window[name]) { delete window[name]; try{document.head.removeChild(s);}catch(e){} cb(null,'timeout'); }
  }, 10000);
  window[name] = function(d) {
    clearTimeout(timer); delete window[name]; try{document.head.removeChild(s);}catch(e){} cb(d, null);
  };
  s.onerror = function() {
    clearTimeout(timer); delete window[name]; try{document.head.removeChild(s);}catch(e){} cb(null,'error');
  };
  s.src = url + (url.indexOf('?')>=0?'&':'?') + 'callback=' + name + '&_t=' + Date.now();
  document.head.appendChild(s);
}

function loadOrders(showToast) {
  jsonp(SCRIPT_URL + '?action=getPedidos', function(data, err) {
    if (err || !data) {
      document.getElementById('refresh-label').textContent = 'Error de conexión';
      document.getElementById('orders-list').innerHTML =
        '<div class="empty-msg"><span class="empty-icon">⚠️</span>No se pudo conectar.<br>Verifica tu internet e intenta de nuevo.</div>';
      return;
    }
    allOrders = Array.isArray(data) ? data : [];
    renderOrders();
    updatePendCount();
    const hora = new Date().toLocaleTimeString('es-BO', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('refresh-label').textContent = 'Actualizado a las ' + hora;
    if (showToast) toast('🔄 Pedidos actualizados');
  });
}

function accionPedido(row, accion, btnId, textoEspera, textoExito, nuevoEstado) {
  const btn = document.getElementById(btnId);
  if (btn) { btn.textContent = textoEspera; btn.disabled = true; }
  jsonp(SCRIPT_URL + '?action=' + accion + '&row=' + row, function(data, err) {
    if (err) {
      if (btn) { btn.textContent = textoExito; btn.disabled = false; }
      toast('⚠️ Error al actualizar');
      return;
    }
    const order = allOrders.find(function(o) { return o.row === row; });
    if (order) order.estado = nuevoEstado;
    renderOrders();
    updatePendCount();
    toast(nuevoEstado === 'Completado' ? '✅ Pedido completado' : '🔄 Pedido reabierto');
  });
}

function completeOrder(row) {
  accionPedido(row, 'completar', 'btn-comp-' + row, '⏳ Actualizando...', '✅ Marcar como completado', 'Completado');
}

function reabrirOrder(row) {
  accionPedido(row, 'reabrir', 'btn-reab-' + row, '⏳ Actualizando...', '↩️ Reabrir pedido', 'Pendiente');
}

function renderOrders() {
  const list = document.getElementById('orders-list');
  const filtered = allOrders.filter(function(o) { return o.estado === currentTab; });
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-msg"><span class="empty-icon">' +
      (currentTab === 'Pendiente' ? '🕐' : '✅') + '</span>' +
      (currentTab === 'Pendiente' ? 'No hay pedidos pendientes' : 'No hay pedidos completados') +
      '</div>';
    return;
  }
  list.innerHTML = filtered.map(function(o) {
    var itemLines = o.items.split(' | ').map(function(i) { return '• ' + i; }).join('<br>');
    var hora = o.fecha ? (o.fecha.indexOf(',')>=0 ? o.fecha.split(',')[1].trim() : o.fecha) : '';
    return '<div class="order-card ' + (o.estado==='Completado'?'done':'pendiente') + '">' +
      '<div class="order-head">' +
        '<span class="order-num">' + o.pedido + '</span>' +
        '<span class="order-client">' + o.cliente + '</span>' +
        '<span class="order-time">' + hora + '</span>' +
      '</div>' +
      '<div class="order-items">' + itemLines + '</div>' +
      '<div class="order-total">💰 ' + o.total + '</div>' +
      (o.estado === 'Pendiente'
        ? '<button class="btn-complete" id="btn-comp-' + o.row + '" onclick="completeOrder(' + o.row + ')">✅ Marcar como completado</button>'
        : '<button class="btn-complete done-state" style="opacity:0.5;cursor:default;">✅ Entregado</button>' +
          '<button class="btn-reabrir" id="btn-reab-' + o.row + '" onclick="reabrirOrder(' + o.row + ')">↩️ Reabrir por error</button>') +
      '</div>';
  }).join('');
}

function updatePendCount() {
  var count = allOrders.filter(function(o) { return o.estado==='Pendiente'; }).length;
  var el = document.getElementById('pend-count');
  el.textContent = count; el.style.display = count>0?'':'none';
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-pend').classList.toggle('active', tab==='Pendiente');
  document.getElementById('tab-done').classList.toggle('active', tab==='Completado');
  renderOrders();
}

function abrirModalDia() { document.getElementById('modal-dia').classList.add('open'); }
function cerrarModal() { document.getElementById('modal-dia').classList.remove('open'); }

function cerrarDia() {
  const btn = document.getElementById('btn-confirmar-dia');
  btn.textContent = '⏳ Cerrando...'; btn.disabled = true;
  jsonp(SCRIPT_URL + '?action=cerrarDia', function(data, err) {
    btn.textContent = 'Confirmar'; btn.disabled = false;
    cerrarModal();
    if (err) { toast('⚠️ Error al cerrar el día'); return; }
    allOrders = [];
    renderOrders();
    updatePendCount();
    toast('📅 Día cerrado. Nueva hoja creada.');
  });
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

loadOrders(false);
setInterval(function() { loadOrders(false); }, 30000);
document.addEventListener('visibilitychange', function() { if (!document.hidden) loadOrders(false); });
</script>
</body>
</html>
