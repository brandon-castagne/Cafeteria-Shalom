<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rol de Ingreso · Virgen de Guadalupe 2026</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#FBF3E6;
    color:#211533;
    padding: 20px 16px 60px;
  }
  header{ max-width:640px; margin:0 auto 18px; }
  h1{
    font-size:1.4rem;
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:#5a5169;
    font-size:0.9rem;
  }
  .progress{
    max-width:640px; margin:0 auto 16px;
    font-size:0.85rem;
    color:#2C7873;
    font-weight:600;
  }
  ul{
    max-width:640px;
    margin:0 auto;
    padding:0;
    list-style:none;
  }
  li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 10px;
    border-bottom:1px solid #e4d8bd;
  }
  li input{
    width:20px;
    height:20px;
    flex-shrink:0;
    accent-color:#C6357F;
  }
  li .time{
    font-variant-numeric:tabular-nums;
    color:#5a5169;
    font-size:0.85rem;
    width:44px;
    flex-shrink:0;
  }
  li .name{
    flex:1;
    font-size:0.98rem;
  }
  li.checked .name, li.checked .time{
    text-decoration:line-through;
    opacity:0.45;
  }
  .tag{
    font-size:0.68rem;
    color:#E0A428;
    border:1px solid #E0A428;
    padding:1px 7px;
    border-radius:12px;
    white-space:nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Entrada Virgen de Guadalupe 2026</h1>
  <p>Sábado 12 de septiembre — marca cada fraternidad al pasar</p>
</header>
<div class="progress" id="progress">0 / 65 marcadas</div>

];

const list = document.getElementById('list');
const progress = document.getElementById('progress');

schedule.forEach((item, i)=>{
  const li = document.createElement('li');
  li.innerHTML = `
    <input type="checkbox" id="c${i}">
    <span class="time">${item.t}</span>
    <span class="name">${item.name}</span>
    ${item.guest ? '<span class="tag">Invitado</span>' : ''}
  `;
  list.appendChild(li);
  const box = li.querySelector('input');
  box.addEventListener('change', ()=>{
    li.classList.toggle('checked', box.checked);
    updateProgress();
  });
});

function updateProgress(){
  const checked = document.querySelectorAll('#list input:checked').length;
  progress.textContent = `${checked} / ${schedule.length} marcadas`;
}
</script>

</body>
</html>
