<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D9E75">
<title>Shalom — Caja</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1D9E75; --green-light: #E1F5EE;
    --bg: #F5F5F2; --card: #FFFFFF; --text: #1a1a1a;
    --muted: #888780; --border: rgba(0,0,0,0.08); --border-s: rgba(0,0,0,0.15);
    --r: 12px; --rs: 8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100%; height: -webkit-fill-available; }

  .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .topbar h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .topbar-badge { background: var(--green); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .logo-pill { background: var(--green); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }

  .scroll-body { flex: 1; overflow-y: auto; padding: 10px 12px 4px; -webkit-overflow-scrolling: touch; min-height: 0; }
  .section-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 12px 0 6px 2px; }
  .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 7px; }
  .product-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r); padding: 10px 9px; text-align: left; cursor: pointer; position: relative; transition: border-color 0.15s, background 0.15s; width: 100%; }
  .product-btn:active { transform: scale(0.97); }
  .product-btn.selected { border: 2px solid var(--green); background: var(--green-light); }
  .p-name { font-size: 12px; font-weight: 600; line-height: 1.3; margin-bottom: 2px; }
  .p-desc { font-size: 10px; color: var(--muted); line-height: 1.3; margin-bottom: 4px; }
  .p-price { font-size: 14px; font-weight: 600; color: var(--green); }
  .qty-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; }
  .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: none; font-size: 19px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn.minus { background: #fff; color: #E24B4A; border: 1.5px solid #E24B4A; }
  .qty-btn.plus  { background: var(--green); color: #fff; }
  .qty-num { font-size: 17px; font-weight: 700; color: var(--text); }
  .spacer { height: 8px; }

  .cart-bar {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    padding-bottom: calc(10px + var(--safe-bottom));
    flex-shrink: 0;
  }
  .cart-row { display: flex; align-items: center; margin-bottom: 8px; }
  .cart-total { font-size: 15px; font-weight: 600; flex: 1; }
  .cart-count { font-size: 12px; color: var(--muted); }
  .client-input { width: 100%; border: 1px solid var(--border-s); border-radius: var(--rs); padding: 10px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin-bottom: 8px; outline: none; }
  .client-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }
  .btn-full { width: 100%; background: var(--green); border: none; border-radius: var(--rs); padding: 13px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-full:disabled { opacity: 0.6; cursor: not-allowed; }

  #toast { position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(8px); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="logo-pill">SH82</span>
    <h1>Caja — Nuevo pedido</h1>
    <span class="topbar-badge" id="cart-badge" style="display:none;">0</span>
  </div>
  <div class="scroll-body">
    <div class="section-label">🍔 Comida</div>
    <div class="product-grid" id="g-comida"></div>
    <div class="section-label">🥪 Sándwich</div>
    <div class="product-grid" id="g-sandwich"></div>
    <div class="section-label">☕ Bebidas calientes</div>
    <div class="product-grid" id="g-caliente"></div>
    <div class="section-label">🥤 Bebidas frías</div>
    <div class="product-grid" id="g-fria"></div>
    <div class="spacer"></div>
  </div>
  <div class="cart-bar">
    <div class="cart-row">
      <span class="cart-total" id="cart-total">Total: 0 Bs</span>
      <span class="cart-count" id="cart-count">Sin productos</span>
    </div>
    <input class="client-input" id="client-name" placeholder="Nombre del cliente (ej: Juan Pérez)" />
    <button class="btn-full" id="send-btn" onclick="sendPedido()">✉️ Enviar pedido completo</button>
  </div>
</div>
<div id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_SWEGDqpE5MFn4J_thnWDhidGkBJSsAmjSOREv-fT2wjALa9pyzQdVhH-xrcKRyQ/exec';

const MENU = {
  comida: [
    { id:'b1', name:'Burguer SH82', desc:'Pan, carne, queso, pimentón, tomate, lechuga y papa frita', price:15 },
    { id:'b2', name:'León XIV', desc:'Salchipapa, papa frita y salsa especial', price:10 },
    { id:'b3', name:'Papa Francisco', desc:'Huevo frito, papa frita y salsa especial', price:10 },
    { id:'b4', name:'Benedicto XVI', desc:'Porción de papa frita y salsa especial', price:8 },
  ],
  sandwich: [
    { id:'s1', name:'Israel', desc:'Pan molde, jamón, queso, tomate', price:10 },
    { id:'s2', name:'Santa Clara', desc:'Pan molde, queso, tomate y salsa', price:11 },
    { id:'s3', name:'Carlos Acutis', desc:'Pan molde, huevo, tomate y salsa', price:10 },
    { id:'s4', name:'Queque de Zanahoria', desc:'', price:5 },
  ],
  caliente: [
    { id:'c1', name:'Café Asís', desc:'Café cremoso', price:10 },
    { id:'c2', name:'Café Clarisa', desc:'Café cremoso con leche', price:11 },
    { id:'c3', name:'Capuchino Pío', desc:'Café cremoso con leche y chocolate', price:12 },
    { id:'c4', name:'Té', desc:'Clásico, limón, canela, y manzanilla', price:5 },
  ],
  fria: [
    { id:'f1', name:'San Juan Pablo II', desc:'Limonada', price:7 },
    { id:'f2', name:'Espíritu de Amor', desc:'Jugo de frutilla y limón', price:8 },
    { id:'f3', name:'Santa Rosa', desc:'Jugo de frutilla', price:8 },
    { id:'f4', name:'Agua', desc:'', price:3 },
  ]
};

let cart = {};
let counter = parseInt(localStorage.getItem('sh82_counter') || '1');

function findProduct(id) {
  for (const cat of Object.values(MENU)) { const p = cat.find(x => x.id === id); if (p) return p; }
}
function changeQty(id, delta) {
  const next = (cart[id] || 0) + delta;
  if (next <= 0) delete cart[id]; else cart[id] = next;
  updateCart();
}
function renderMenu() {
  ['comida','sandwich','caliente','fria'].forEach(cat => {
    const g = document.getElementById('g-' + cat);
    g.innerHTML = '';
    MENU[cat].forEach(p => {
      const qty = cart[p.id] || 0;
      const btn = document.createElement('button');
      btn.className = 'product-btn' + (qty ? ' selected' : '');
      if (qty > 0) {
        btn.innerHTML =
          '<div class="p-name">' + p.name + '</div>' +
          '<div class="p-price">' + p.price + ' Bs</div>' +
          '<div class="qty-controls">' +
            '<button class="qty-btn minus" onclick="event.stopPropagation();changeQty(\'' + p.id + '\',-1)">−</button>' +
            '<span class="qty-num">' + qty + '</span>' +
            '<button class="qty-btn plus" onclick="event.stopPropagation();changeQty(\'' + p.id + '\',1)">+</button>' +
          '</div>';
        btn.onclick = null;
      } else {
        btn.innerHTML =
          '<div class="p-name">' + p.name + '</div>' +
          (p.desc ? '<div class="p-desc">' + p.desc + '</div>' : '') +
          '<div class="p-price">' + p.price + ' Bs</div>';
        btn.onclick = function() { cart[p.id] = 1; updateCart(); };
      }
      g.appendChild(btn);
    });
  });
}
function updateCart() {
  let total = 0, count = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const p = findProduct(id);
    if (p) { total += p.price * qty; count += qty; }
  });
  document.getElementById('cart-total').textContent = 'Total: ' + total + ' Bs';
  document.getElementById('cart-count').textContent = count > 0 ? count + ' producto' + (count > 1 ? 's' : '') : 'Sin productos';
  const badge = document.getElementById('cart-badge');
  badge.textContent = count;
  badge.style.display = count > 0 ? '' : 'none';
  renderMenu();
}
function sendPedido() {
  if (!Object.keys(cart).length) { toast('⚠️ Agrega al menos un producto'); return; }
  const client = document.getElementById('client-name').value.trim() || 'Sin nombre';
  const lines = [];
  let total = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const p = findProduct(id);
    if (p) { lines.push(qty + 'x ' + p.name + ' - ' + (p.price * qty) + ' Bs'); total += p.price * qty; }
  });
  const now = new Date().toLocaleString('es-BO');
  const btn = document.getElementById('send-btn');
  btn.textContent = '⏳ Enviando...';
  btn.disabled = true;
  const params = new URLSearchParams({ action:'nuevoPedido', pedido:counter, cliente:client, items:lines.join(' | '), total:total, fecha:now });
  const cbName = 'cb_' + Date.now();
  const script = document.createElement('script');
  const done = function(ok) {
    delete window[cbName];
    try { document.head.removeChild(script); } catch(e) {}
    if (ok) {
      toast('✅ Pedido #' + counter + ' enviado');
      counter++; localStorage.setItem('sh82_counter', counter);
      cart = {}; document.getElementById('client-name').value = '';
      updateCart();
    } else { toast('⚠️ Error al enviar. Revisa tu internet.'); }
    btn.textContent = '✉️ Enviar pedido completo'; btn.disabled = false;
  };
  window[cbName] = function() { done(true); };
  script.onerror = function() { done(false); };
  setTimeout(function() { if (window[cbName]) done(false); }, 10000);
  script.src = SCRIPT_URL + '?' + params.toString() + '&callback=' + cbName;
  document.head.appendChild(script);
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
renderMenu();
</script>
</body>
</html>
