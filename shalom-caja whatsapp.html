<style>
  :root {
    --green: #1D9E75; --green-light: #E1F5EE;
    --bg: #2A1B12; --card: #F5EBDD; --text: #2A1B12;
    --muted: #8a7a68; --border: rgba(0,0,0,0.08); --border-s: rgba(0,0,0,0.15);
    --orange: #E8720C; --orange-light: #FFF3E6;
    --r: 12px; --rs: 8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100%; height: -webkit-fill-available; }

  body { background: var(--bg); }
  .topbar { background: var(--bg); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 14px 16px 6px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .topbar h1 { font-size: 20px; font-weight: 600; flex: 1; color: #fff; letter-spacing: 0.02em; }
  .topbar-badge { background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .logo-pill { background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }

  .scroll-body { flex: 1; overflow-y: auto; padding: 10px 12px 4px; -webkit-overflow-scrolling: touch; min-height: 0; }
  .section-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.07em; margin: 12px 0 8px 2px; }
  .product-grid { display: flex; flex-direction: column; gap: 10px; }
  .product-btn { background: var(--card); border: 1.5px solid transparent; border-radius: 30px; padding: 10px 14px; text-align: left; cursor: pointer; position: relative; transition: border-color 0.15s; width: 100%; display: flex; align-items: center; gap: 12px; }
  .product-btn:active { transform: scale(0.98); }
  .product-btn.selected { border: 2px solid var(--orange); }
  .p-icon { font-size: 26px; width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--orange-light); border-radius: 50%; }
  .p-body { flex: 1; min-width: 0; }
  .p-name { font-size: 14px; font-weight: 700; line-height: 1.25; margin-bottom: 1px; }
  .p-desc { font-size: 11px; color: var(--orange); font-weight: 700; line-height: 1.3; }
  .p-price { font-size: 14px; font-weight: 700; color: #fff; background: var(--orange); border-radius: 14px; padding: 5px 12px; flex-shrink: 0; }
  .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: none; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn.minus { background: #fff; color: #E24B4A; border: 1.5px solid #E24B4A; }
  .qty-btn.plus  { background: var(--orange); color: #fff; }
  .qty-num { font-size: 15px; font-weight: 700; color: var(--text); min-width: 14px; text-align: center; }
  .spacer { height: 8px; }

  .cart-bar {
    background: var(--bg);
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 10px 14px;
    padding-bottom: calc(10px + var(--safe-bottom));
    flex-shrink: 0;
  }
  .cart-total, .cart-count { color: #fff; }
  .cart-count { color: rgba(255,255,255,0.6); }
  .client-input { width: 100%; border-radius: var(--rs); padding: 10px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 8px; outline: none; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
  .client-input::placeholder { color: rgba(255,255,255,0.45); }
  .client-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232,114,12,0.18); }
  .btn-full { background: var(--orange); }
  .cart-row { display: flex; align-items: center; margin-bottom: 8px; }
  .cart-total { font-size: 15px; font-weight: 600; flex: 1; }
  .cart-count { font-size: 12px; color: var(--muted); }
  .btn-full { width: 100%; background: var(--green); border: none; border-radius: var(--rs); padding: 13px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-full:disabled { opacity: 0.6; cursor: not-allowed; }

  #toast { position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(8px); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="logo-pill">SH82</span>
    <h1>Caja — Nuevo pedido</h1>
    <span class="topbar-badge" id="cart-badge" style="display:none;">0</span>
  </div>
  <div class="scroll-body">
    <div class="section-label">🍽️ Menú</div>
    <div class="product-grid" id="g-menu"></div>
    <div class="spacer"></div>
  </div>
  <div class="cart-bar">
    <div class="cart-row">
      <span class="cart-total" id="cart-total">Total: 0 Bs</span>
      <span class="cart-count" id="cart-count">Sin productos</span>
    </div>
    <input class="client-input" id="client-name" placeholder="Nombre y apellido del cliente" />
    <button class="btn-full" id="send-btn" onclick="sendPedido()">✉️ Enviar pedido</button>
  </div>
</div>
<div id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_SWEGDqpE5MFn4J_thnWDhidGkBJSsAmjSOREv-fT2wjALa9pyzQdVhH-xrcKRyQ/exec';
const WHATSAPP_GROUP_LINK = ''; // opcional: si quieres, pega aquí el link de invitación del grupo (solo referencia, no se usa para auto-enviar)

const MENU = {
  menu: [
    { id:'p1a', name:'Papa Rellena', desc:'De huevo', price:6, icon:'🥔', wa:'🥔 Papa (de huevo)' },
    { id:'p1b', name:'Papa Rellena', desc:'De queso', price:6, icon:'🥔', wa:'🥔 Papa (de queso)' },
    { id:'p2', name:'Tamal', desc:'', price:13, icon:'🫔', wa:'🫔 Tamal' },
    { id:'p3', name:'Soda 300ml', desc:'', price:3, icon:'🥤', wa:'🍾 Botella de soda 300ml' },
    { id:'p4', name:'Soda 600ml', desc:'', price:5, icon:'🥤', wa:'🍾 Botella de soda 600ml' },
    { id:'p5', name:'Vaso de soda', desc:'', price:2, icon:'🧊', wa:'🥤 Vaso de soda' },
  ]
};

let cart = {};
let counter = parseInt(localStorage.getItem('sh82_counter') || '1');

function findProduct(id) {
  for (const cat of Object.values(MENU)) { const p = cat.find(x => x.id === id); if (p) return p; }
}
function changeQty(id, delta) {
  const next = (cart[id] || 0) + delta;
  if (next <= 0) delete cart[id]; else cart[id] = next;
  updateCart();
}
function renderMenu() {
  ['menu'].forEach(cat => {
    const g = document.getElementById('g-' + cat);
    g.innerHTML = '';
    MENU[cat].forEach(p => {
      const qty = cart[p.id] || 0;
      const btn = document.createElement('button');
      btn.className = 'product-btn' + (qty ? ' selected' : '');
      const info = '<div class="p-icon">' + p.icon + '</div>' +
        '<div class="p-body">' +
          '<div class="p-name">' + p.name + '</div>' +
          (p.desc ? '<div class="p-desc">' + p.desc + '</div>' : '') +
        '</div>';
      if (qty > 0) {
        btn.innerHTML = info +
          '<div class="qty-controls">' +
            '<button class="qty-btn minus" onclick="event.stopPropagation();changeQty(\'' + p.id + '\',-1)">−</button>' +
            '<span class="qty-num">' + qty + '</span>' +
            '<button class="qty-btn plus" onclick="event.stopPropagation();changeQty(\'' + p.id + '\',1)">+</button>' +
          '</div>';
        btn.onclick = null;
      } else {
        btn.innerHTML = info + '<div class="p-price">' + p.price + ' Bs</div>';
        btn.onclick = function() { cart[p.id] = 1; updateCart(); };
      }
      g.appendChild(btn);
    });
  });
}
function updateCart() {
  let total = 0, count = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const p = findProduct(id);
    if (p) { total += p.price * qty; count += qty; }
  });
  document.getElementById('cart-total').textContent = 'Total: ' + total + ' Bs';
  document.getElementById('cart-count').textContent = count > 0 ? count + ' producto' + (count > 1 ? 's' : '') : 'Sin productos';
  const badge = document.getElementById('cart-badge');
  badge.textContent = count;
  badge.style.display = count > 0 ? '' : 'none';
  renderMenu();
}

// Registra el pedido en Sheets (en segundo plano, no bloquea el envío a WhatsApp)
function logToSheet(pedidoNum, client, lines, total, now) {
  const params = new URLSearchParams({ action:'nuevoPedido', pedido:pedidoNum, cliente:client, items:lines.join(' | '), total:total, fecha:now });
  const cbName = 'cb_' + Date.now();
  const script = document.createElement('script');
  const cleanup = function() {
    delete window[cbName];
    try { document.head.removeChild(script); } catch(e) {}
  };
  window[cbName] = cleanup;
  script.onerror = cleanup;
  setTimeout(function() { if (window[cbName]) cleanup(); }, 10000);
  script.src = SCRIPT_URL + '?' + params.toString() + '&callback=' + cbName;
  document.head.appendChild(script);
}

function sendPedido() {
  if (!Object.keys(cart).length) { toast('⚠️ Agrega al menos un producto'); return; }
  const client = document.getElementById('client-name').value.trim() || 'Sin nombre';
  const lines = [];
  let total = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const p = findProduct(id);
    if (p) { lines.push(qty + 'x ' + p.name + (p.desc ? ' (' + p.desc + ')' : '') + ' - ' + (p.price * qty) + ' Bs'); total += p.price * qty; }
  });
  const now = new Date().toLocaleString('es-BO');
  const pedidoNum = counter;

  // Texto para WhatsApp (sin precios, sin total, sin fecha)
  const waLines = [];
  Object.entries(cart).forEach(([id, qty]) => {
    const p = findProduct(id);
    if (p) waLines.push(qty + 'x ' + p.wa);
  });
  const waText =
    '*Pedido #' + pedidoNum + '*\n' +
    'Cliente: ' + client + '\n' +
    waLines.join('\n');

  // Registro en Sheets (en paralelo)
  logToSheet(pedidoNum, client, lines, total, now);

  // Abre WhatsApp con el pedido listo para elegir el grupo/chat destino
  window.open('https://wa.me/?text=' + encodeURIComponent(waText), '_blank');

  toast('✅ Pedido #' + pedidoNum + ' listo para enviar');
  counter++; localStorage.setItem('sh82_counter', counter);
  cart = {}; document.getElementById('client-name').value = '';
  updateCart();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
renderMenu();
</script>
