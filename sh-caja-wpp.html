<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1D9E75; --green-light: #E1F5EE;
    --bg: #2A1B12; --card: #F5EBDD; --text: #2A1B12;
    --muted: #8a7a68; --border: rgba(0,0,0,0.08); --border-s: rgba(0,0,0,0.15);
    --orange: #E8720C; --orange-light: #FFF3E6;
    --r: 12px; --rs: 8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ob-1: rgba(255,255,255,0.1); --ob-2: rgba(255,255,255,0.2); --ob-3: rgba(255,255,255,0.3);
    --ob-08: rgba(255,255,255,0.08); --ob-45: rgba(255,255,255,0.45); --ob-5: rgba(255,255,255,0.5);
    --ob-6: rgba(255,255,255,0.6); --ob-7: rgba(255,255,255,0.7); --ob-8: rgba(255,255,255,0.8);
    --ob-85: rgba(255,255,255,0.85); --ob-solid: #fff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F5F1EA; --card: #FFFFFF;
      --ob-1: rgba(0,0,0,0.08); --ob-2: rgba(0,0,0,0.15); --ob-3: rgba(0,0,0,0.2);
      --ob-08: rgba(0,0,0,0.05); --ob-45: rgba(0,0,0,0.35); --ob-5: rgba(0,0,0,0.45);
      --ob-6: rgba(0,0,0,0.55); --ob-7: rgba(0,0,0,0.65); --ob-8: rgba(0,0,0,0.75);
      --ob-85: rgba(0,0,0,0.8); --ob-solid: #2A1B12;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100%; height: -webkit-fill-available; }

  body { background: var(--bg); }
  .topbar { background: var(--bg); border-bottom: 1px solid var(--ob-1); padding: 6px 16px 4px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .topbar h1 { font-size: 16px; font-weight: 600; flex: 1; color: var(--ob-solid); letter-spacing: 0.02em; }
  .topbar-badge { background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .logo-pill { background: var(--orange); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .change-num-btn { background: transparent; border: 1.5px solid var(--ob-3); color: var(--ob-85); font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 20px; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
  .change-num-btn:active { transform: scale(0.97); }

  .scroll-body { flex: 1; overflow-y: auto; padding: 10px 12px 4px; -webkit-overflow-scrolling: touch; min-height: 0; }
  .section-label { font-size: 10px; font-weight: 600; color: var(--ob-5); text-transform: uppercase; letter-spacing: 0.07em; margin: 12px 0 8px 2px; }
  .product-grid { display: flex; flex-direction: column; gap: 10px; }
  .product-btn { background: var(--card); border: 1.5px solid transparent; border-radius: 30px; padding: 10px 14px; text-align: left; cursor: pointer; position: relative; transition: border-color 0.15s; width: 100%; display: flex; align-items: center; gap: 12px; }
  .product-btn:active { transform: scale(0.98); }
  .product-btn.selected { border: 2px solid var(--orange); }
  .p-icon { font-size: 26px; width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--orange-light); border-radius: 50%; }
  .p-body { flex: 1; min-width: 0; }
  .p-name { font-size: 14px; font-weight: 700; line-height: 1.25; margin-bottom: 1px; }
  .p-desc { font-size: 11px; color: var(--orange); font-weight: 700; line-height: 1.3; }
  .p-price { font-size: 14px; font-weight: 700; color: #fff; background: var(--orange); border-radius: 14px; padding: 5px 12px; flex-shrink: 0; }
  .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: none; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn.minus { background: #fff; color: #E24B4A; border: 1.5px solid #E24B4A; }
  .qty-btn.plus  { background: var(--orange); color: #fff; }
  .qty-num { font-size: 15px; font-weight: 700; color: var(--text); min-width: 14px; text-align: center; }
  .spacer { height: 8px; }

  .mi-cat-header { position: sticky; top: 0; background: var(--bg); z-index: 5; font-size: 10px; font-weight: 700; color: var(--ob-6); text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 2px 6px; }
  .mi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 6px; }
  @media (min-width: 480px) { .mi-grid { grid-template-columns: repeat(3, 1fr); } }
  .mi-card { background: var(--card); border: 1.5px solid transparent; border-radius: var(--r); padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: left; font-family: 'DM Sans', sans-serif; }
  .mi-card:active { transform: scale(0.97); }
  .mi-card.selected { border-color: var(--orange); }
  .mi-icon { font-size: 20px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: var(--orange-light); border-radius: 50%; }
  .mi-name { font-size: 12.5px; font-weight: 700; line-height: 1.2; }
  .mi-desc { font-size: 10px; color: var(--orange); font-weight: 700; }
  .mi-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .mi-price { font-size: 12px; font-weight: 700; color: #fff; background: var(--orange); border-radius: 12px; padding: 3px 9px; }
  .mi-qty { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: space-between; }
  .mi-qty-btn { width: 24px; height: 24px; border-radius: 50%; border: none; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mi-qty-btn.minus { background: #fff; color: #E24B4A; border: 1.5px solid #E24B4A; }
  .mi-qty-btn.plus { background: var(--orange); color: #fff; }
  .mi-qty-num { font-size: 13px; font-weight: 700; color: var(--text); text-align: center; cursor: pointer; }
  .mi-empty { color: var(--ob-5); font-size: 13px; text-align: center; padding: 24px 10px; }

  .cart-bar {
    background: var(--bg);
    border-top: 1px solid var(--ob-1);
    padding: 8px 14px;
    padding-bottom: calc(8px + var(--safe-bottom));
    flex-shrink: 0;
  }
  .cart-total, .cart-count { color: var(--ob-solid); }
  .cart-count { color: var(--ob-6); }
  .client-input { width: 100%; border-radius: var(--rs); padding: 8px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 6px; outline: none; background: var(--ob-08); border: 1px solid var(--ob-2); color: var(--ob-solid); }
  .client-input::placeholder { color: var(--ob-45); }
  .client-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232,114,12,0.18); }
  .btn-full { background: var(--orange); }
  .cart-row { display: flex; align-items: center; margin-bottom: 6px; }
  .cart-total { font-size: 15px; font-weight: 600; flex: 1; }
  .cart-count { font-size: 12px; color: var(--muted); }
  .btn-full { width: 100%; background: var(--green); border: none; border-radius: var(--rs); padding: 11px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: transform 0.08s; }
  .btn-full:disabled { opacity: 0.6; cursor: not-allowed; }

  #toast { position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(8px); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .tabbar { display: flex; gap: 6px; background: var(--bg); padding: 0 12px 6px; flex-shrink: 0; }
  .tab-btn { flex: 1; background: transparent; border: 1.5px solid var(--ob-2); color: var(--ob-6); font-size: 12px; font-weight: 600; padding: 6px; border-radius: var(--rs); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: transform 0.08s; }
  .tab-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }

  .pay-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .pay-btn { flex: 1; background: var(--ob-08); border: 1.5px solid var(--ob-2); color: var(--ob-8); font-size: 12px; font-weight: 600; padding: 7px; border-radius: var(--rs); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: transform 0.08s; }
  .pay-btn:active, .paid-toggle:active, .sub-btn:active, .btn-full:active, .tab-btn:active { transform: scale(0.95); }
  .pay-btn.active { background: var(--green); border-color: var(--green); color: #fff; }
  .paid-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .paid-toggle { flex: 1; background: var(--ob-08); border: 1.5px solid var(--ob-2); color: var(--ob-8); font-size: 12px; font-weight: 600; padding: 7px; border-radius: var(--rs); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: transform 0.08s; }

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_SWEGDqpE5MFn4J_thnWDhidGkBJSsAmjSOREv-fT2wjALa9pyzQdVhH-xrcKRyQ/exec';
const WHATSAPP_GROUP_LINK = ''; // opcional: si quieres, pega aquí el link de invitación del grupo (solo referencia, no se usa para auto-enviar)

const MENU = {

    { id:'cc3', name:'Capuchino Pío', desc:'Café cremoso con leche y chocolate', price:12, icon:'☕', wa:'☕ Capuchino Pío (café cremoso, leche y chocolate)', cat:'cafe_caliente' },

    { id:'te4', name:'Té', desc:'Verde', price:5, icon:'🍵', wa:'🍵 Té verde', cat:'te' },
    { id:'cm1', name:'Burger SH82', desc:'Pan, carne, lechuga, tomate, pimentón, queso y salsa especial', price:15, icon:'🍔', wa:'🍔 Burger SH82', cat:'comidas' },
    { id:'cm2', name:'León XIV', desc:'Salchipapa con salsa especial', price:10, icon:'🍟', wa:'🍟 León XIV (salchipapa con salsa especial)', cat:'comidas' },
    { id:'cm3', name:'Queque de zanahoria', desc:'Porción con cobertura de chocolate', price:8, icon:'🍰', wa:'🍰 Queque de zanahoria', cat:'comidas' },
  ]
};
const CATEGORIAS = [
  { key:'bebidas_frias', label:'🥤 Bebidas frías' },
  { key:'sandwiches', label:'🥪 Sándwiches' },
  { key:'cafe_caliente', label:'☕ Café caliente' },
  { key:'te', label:'🍵 Té' },
  { key:'comidas', label:'🍽️ Comidas' },
];

let cart = {};
let counter = parseInt(localStorage.getItem('sh82_counter') || '1');
let pedidos = JSON.parse(localStorage.getItem('sh82_pedidos') || '[]');
let payState = { metodo: null, pagado: true, sub: 'falta_pagar' };
let editingNum = null;

// ============================================================
// 🔥 FIREBASE — pega aquí la configuración de TU proyecto
// (Firebase Console → ⚙️ Configuración del proyecto → tus apps → Config)
// ============================================================
const firebaseConfig = {
  apiKey: "PEGA_AQUI_TU_apiKey",
  authDomain: "PEGA_AQUI_TU_authDomain",
  databaseURL: "PEGA_AQUI_TU_databaseURL",
  projectId: "PEGA_AQUI_TU_projectId",
  storageBucket: "PEGA_AQUI_TU_storageBucket",
  messagingSenderId: "PEGA_AQUI_TU_messagingSenderId",
  appId: "PEGA_AQUI_TU_appId"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function idsAObjeto(arr) { const o = {}; arr.forEach(function(id) { o[id] = true; }); return o; }

// Productos agregados desde la app + cambios de precio/nombre — ahora compartidos en vivo entre celulares
let customProducts = [];
let productOverrides = {};
let activos = [];

function saveCustomProducts() {
  const obj = {};
  customProducts.forEach(function(p) { obj[p.id] = Object.assign({}, p); delete obj[p.id].id; });
  db.ref('sh82/customProducts').set(obj);
}
function saveOverrides() { db.ref('sh82/overrides').set(productOverrides); }
function saveActivos() { db.ref('sh82/activos').set(idsAObjeto(activos)); }

function getAllProducts() {
  const base = [];
  Object.values(MENU).forEach(cat => cat.forEach(p => {
    const ov = productOverrides[p.id];
    base.push(ov ? Object.assign({}, p, ov) : p);
  }));
  return base.concat(customProducts);
}

// Escucha en vivo: si otro celular agrega/edita un producto o cambia el menú del día, se refleja acá al instante
db.ref('sh82/customProducts').on('value', function(snap) {
  const val = snap.val() || {};
  customProducts = Object.keys(val).map(function(id) { return Object.assign({ id: id }, val[id]); });
  renderMenu(); renderMenuAdmin();
});
db.ref('sh82/overrides').on('value', function(snap) {
  productOverrides = snap.val() || {};
  renderMenu(); renderMenuAdmin();
});
db.ref('sh82/activos').on('value', function(snap) {
  const val = snap.val();
  if (val === null) {
    // Primera vez que se usa la app: activa todo el catálogo base por defecto
    activos = getAllProducts().map(function(p) { return p.id; });
    saveActivos();
  } else {
    activos = Object.keys(val).filter(function(id) { return val[id]; });
  }
  renderMenu(); renderMenuAdmin();
});

function isActivo(id) { return activos.indexOf(id) !== -1; }

function findProduct(id) {
  return getAllProducts().find(x => x.id === id);
}
function changeQty(id, delta) {
  const next = (cart[id] || 0) + delta;
  if (next <= 0) delete cart[id]; else cart[id] = next;
  updateCart();
}
function renderMenu() {
  const container = document.getElementById('menu-container');
  container.innerHTML = '';
  const visibles = getAllProducts().filter(p => isActivo(p.id));
  if (!visibles.length) { container.innerHTML = '<div class="mi-empty">No hay productos activos hoy. Ve a "⚙️ Menú del día" para activar algunos.</div>'; return; }
  CATEGORIAS.forEach(function(catInfo) {
    const items = visibles.filter(p => (p.cat || 'comidas') === catInfo.key);
    if (!items.length) return;
    const header = document.createElement('div');
    header.className = 'mi-cat-header';
    header.textContent = catInfo.label;
    container.appendChild(header);
    const grid = document.createElement('div');
    grid.className = 'mi-grid';
    items.forEach(function(p) {
      const qty = cart[p.id] || 0;
      const card = document.createElement('button');
      card.className = 'mi-card' + (qty ? ' selected' : '');
      const info = '<div class="mi-icon">' + p.icon + '</div>' +
        '<div class="mi-name">' + p.name + '</div>' +
        (p.desc ? '<div class="mi-desc">' + p.desc + '</div>' : '');
      if (qty > 0) {
        card.innerHTML = info +
          '<div class="mi-bottom"><div class="mi-qty">' +
            '<button class="mi-qty-btn minus" onclick="event.stopPropagation();changeQty(\'' + p.id + '\',-1)">−</button>' +
            '<span class="mi-qty-num" onclick="event.stopPropagation();setQtyPrompt(\'' + p.id + '\')">' + qty + '</span>' +
            '<button class="mi-qty-btn plus" onclick="event.stopPropagation();changeQty(\'' + p.id + '\',1)">+</button>' +
          '</div></div>';
        card.onclick = null;
      } else {
        card.innerHTML = info + '<div class="mi-bottom"><span class="mi-price">' + p.price + ' Bs</span></div>';
        card.onclick = function() { cart[p.id] = 1; updateCart(); };
      }
      grid.appendChild(card);
    });
    container.appendChild(grid);
  });
}
function updateCart() {
  let total = 0, count = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const p = findProduct(id);
    if (p) { total += p.price * qty; count += qty; }
  });
  document.getElementById('cart-total').textContent = 'Total: ' + total + ' Bs';
  document.getElementById('cart-count').textContent = count > 0 ? count + ' producto' + (count > 1 ? 's' : '') : 'Sin productos';
  const badge = document.getElementById('cart-badge');
  badge.textContent = count;
  badge.style.display = count > 0 ? '' : 'none';
  renderMenu();
}

// Llamada genérica al Apps Script vía JSONP (en segundo plano, no bloquea la UI)
function callSheet(params) {
  const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  const script = document.createElement('script');
  const cleanup = function() {
    delete window[cbName];
    try { document.head.removeChild(script); } catch(e) {}
  };
  window[cbName] = cleanup;
  script.onerror = cleanup;
  setTimeout(function() { if (window[cbName]) cleanup(); }, 10000);
  script.src = SCRIPT_URL + '?' + params.toString() + '&callback=' + cbName;
  document.head.appendChild(script);
}

// Registra el pedido en Sheets, incluyendo método y estado de pago
function logToSheet(pedidoNum, client, lines, total, now, metodo, pagado, sub) {
  callSheet(new URLSearchParams({
    action: 'nuevoPedido',
    pedido: pedidoNum,
    cliente: client,
    items: lines.join(' | '),
    total: total,
    fecha: now,
    metodo: metodo,
    estado: pagado ? 'pagado' : 'no_pagado',
    subestado: sub || ''
  }));
}

// Actualiza en Sheets el estado de pago de un pedido ya existente
function updatePagoInSheet(pedidoNum, pagado, sub) {
  callSheet(new URLSearchParams({
    action: 'actualizarPago',
    pedido: pedidoNum,
    estado: pagado ? 'pagado' : 'no_pagado',
    subestado: sub || ''
  }));
}

// Cierra el día en Sheets: archiva "HOY" con el nombre del día y deja una hoja "HOY" limpia
function cerrarDiaEnSheet() {
  if (!window.confirm('¿Cerrar el día? Esto archiva todos los pedidos de "HOY" en una hoja nueva con el nombre del día, y deja "HOY" lista para mañana. No se puede deshacer.')) return;
  const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  const script = document.createElement('script');
  const cleanup = function() {
    delete window[cbName];
    try { document.head.removeChild(script); } catch(e) {}
  };
  window[cbName] = function(data) {
    cleanup();
    if (data && data.status === 'ok') {
      toast('📦 Día archivado como "' + data.nombre + '"');
    } else {
      toast('⚠️ No se pudo cerrar el día');
    }
  };
  script.onerror = function() { cleanup(); toast('⚠️ No se pudo conectar con Sheets'); };
  setTimeout(function() { if (window[cbName]) { cleanup(); toast('⚠️ Sin respuesta de Sheets'); } }, 10000);
  script.src = SCRIPT_URL + '?' + new URLSearchParams({ action: 'cerrarDia' }).toString() + '&callback=' + cbName;
  document.head.appendChild(script);
}

function sendPedido() {
  if (!Object.keys(cart).length) { toast('⚠️ Agrega al menos un producto'); return; }
  if (!payState.metodo) { toast('⚠️ Selecciona método de pago (QR o Efectivo)'); return; }
  const rawClient = document.getElementById('client-name').value.trim();
  const client = rawClient || 'Sin nombre';
  const lines = [];
  let total = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const p = findProduct(id);
    if (p) { lines.push(qty + 'x ' + p.name + (p.desc ? ' (' + p.desc + ')' : '') + ' - ' + (p.price * qty) + ' Bs'); total += p.price * qty; }
  });
  const sub = (payState.metodo === 'efectivo' && !payState.pagado) ? payState.sub : null;

  if (editingNum !== null) {
    const idx = pedidos.findIndex(function(p) { return p.num === editingNum; });
    if (idx === -1) { toast('⚠️ No se encontró el pedido a editar'); salirModoEdicion(); return; }
    pedidos[idx] = Object.assign({}, pedidos[idx], {
      cliente: client, lines: lines, total: total,
      metodo: payState.metodo, pagado: payState.pagado, sub: sub,
      cart: Object.assign({}, cart)
    });
    savePedidos();
    updatePagoInSheet(editingNum, payState.pagado, sub);
    toast('✅ Pedido #' + editingNum + ' actualizado');
    salirModoEdicion();
    showView('pedidos');
    return;
  }

  const now = new Date();
  const nowStr = now.toLocaleString('es-BO');
  const horaStr = now.toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit' });
  const pedidoNum = counter;

  // Texto para WhatsApp (con precio por línea y total, sin fecha)
  const waLines = [];
  Object.entries(cart).forEach(([id, qty]) => {
    const p = findProduct(id);
    if (p) waLines.push(qty + 'x ' + p.wa + ' - ' + (p.price * qty) + ' Bs');
  });
  const waText =
    '*Pedido #' + pedidoNum + '*\n' +
    'Cliente: ' + client + '\n' +
    waLines.join('\n') + '\n' +
    'Total: ' + total + ' Bs';

  // Registro en Sheets (en paralelo)
  logToSheet(pedidoNum, client, lines, total, nowStr, payState.metodo, payState.pagado, sub);

  // Guarda el pedido localmente para la vista de Pedidos
  pedidos.unshift({
    num: pedidoNum,
    cliente: client,
    lines: lines,
    total: total,
    hora: horaStr,
    fecha: now.toLocaleDateString('es-BO'),
    metodo: payState.metodo,
    pagado: payState.pagado,
    sub: sub,
    cart: Object.assign({}, cart)
  });
  savePedidos();

  // Abre WhatsApp con el pedido listo para elegir el grupo/chat destino
  window.open('https://wa.me/?text=' + encodeURIComponent(waText), '_blank');

  toast(rawClient ? ('✅ Pedido #' + pedidoNum + ' listo para enviar') : ('✅ Pedido #' + pedidoNum + ' enviado sin nombre de cliente'));
  counter++; localStorage.setItem('sh82_counter', counter);
  cart = {}; document.getElementById('client-name').value = '';
  resetPayState();
  updateCart();
}

function renderPayState() {
  document.getElementById('pay-qr').classList.toggle('active', payState.metodo === 'qr');
  document.getElementById('pay-efectivo').classList.toggle('active', payState.metodo === 'efectivo');
  const paidBtn = document.getElementById('paid-toggle');
  paidBtn.textContent = payState.pagado ? '✅ Pagado' : '❌ No pagado';
  paidBtn.classList.toggle('is-paid', payState.pagado);
  paidBtn.classList.toggle('is-unpaid', !payState.pagado);
  const showSub = payState.metodo === 'efectivo' && !payState.pagado;
  document.getElementById('sub-row').style.display = showSub ? 'flex' : 'none';
  document.getElementById('sub-falta-pagar').classList.toggle('active', payState.sub === 'falta_pagar');
  document.getElementById('sub-falta-cambio').classList.toggle('active', payState.sub === 'falta_cambio');
}
function resetPayState() {
  payState = { metodo: null, pagado: true, sub: 'falta_pagar' };
  renderPayState();
}
function setupPaySelectors() {
  document.getElementById('pay-qr').addEventListener('click', function() { payState.metodo = 'qr'; renderPayState(); });
  document.getElementById('pay-efectivo').addEventListener('click', function() { payState.metodo = 'efectivo'; renderPayState(); });
  document.getElementById('paid-toggle').addEventListener('click', function() { payState.pagado = !payState.pagado; renderPayState(); });
  document.getElementById('sub-falta-pagar').addEventListener('click', function() { payState.sub = 'falta_pagar'; renderPayState(); });
  document.getElementById('sub-falta-cambio').addEventListener('click', function() { payState.sub = 'falta_cambio'; renderPayState(); });
}
setupPaySelectors();
renderPayState();

function labelMetodo(m) { return m === 'qr' ? '📱 QR' : (m === 'efectivo' ? '💵 Efectivo' : '—'); }
function labelSub(s) { return s === 'falta_pagar' ? 'Falta pagar' : 'Falta devolver cambio'; }

function savePedidos() { localStorage.setItem('sh82_pedidos', JSON.stringify(pedidos)); }

let pedidosFilter = 'todos';
let pedidosSearch = '';
let pedidosGroups = [];

function todayStr() { return new Date().toLocaleDateString('es-BO'); }

function renderPedidos() {
  const list = document.getElementById('pedidos-list');
  const term = pedidosSearch.trim().toLowerCase();
  const filtered = pedidos.filter(function(o) {
    if (pedidosFilter === 'pagado' && !o.pagado) return false;
    if (pedidosFilter === 'no_pagado' && o.pagado) return false;
    if (term && !(o.cliente.toLowerCase().includes(term) || String(o.num).includes(term))) return false;
    return true;
  });

  // Resumen de hoy
  const hoy = todayStr();
  const pedidosHoy = pedidos.filter(function(o) { return o.fecha === hoy; });
  const totalVendidoHoy = pedidosHoy.reduce(function(sum, o) { return sum + o.total; }, 0);
  const totalPendienteHoy = pedidosHoy.filter(function(o) { return !o.pagado; }).reduce(function(sum, o) { return sum + o.total; }, 0);
  document.getElementById('pedidos-summary').innerHTML =
    '<span>Pedidos hoy<br><b>' + pedidosHoy.length + '</b></span>' +
    '<span>Vendido hoy<br><b>' + totalVendidoHoy + ' Bs</b></span>' +
    '<span>Falta cobrar hoy<br><b>' + totalPendienteHoy + ' Bs</b></span>';

  if (!filtered.length) { list.innerHTML = '<div class="pedidos-empty">No hay pedidos que coincidan.</div>'; pedidosGroups = []; return; }

  // Agrupar por día (el orden de pedidos ya trae los más recientes primero)
  pedidosGroups = [];
  const idxByFecha = {};
  filtered.forEach(function(o) {
    const key = o.fecha || 'Sin fecha registrada';
    if (!(key in idxByFecha)) { idxByFecha[key] = pedidosGroups.length; pedidosGroups.push({ fecha: key, orders: [] }); }
    pedidosGroups[idxByFecha[key]].orders.push(o);
  });

  list.innerHTML = pedidosGroups.map(function(g, gIdx) {
    const dayTotal = g.orders.reduce(function(sum, o) { return sum + o.total; }, 0);
    const label = g.fecha === hoy ? 'Hoy · ' + g.fecha : g.fecha;
    const header = '<div class="day-header">' +
      '<span class="day-label">' + label + '</span>' +
      '<span class="day-total">' + g.orders.length + ' pedidos · ' + dayTotal + ' Bs</span>' +
      '<button class="day-btn" onclick="copiarDia(' + gIdx + ')">📋 Copiar</button>' +
      '<button class="day-btn" onclick="exportarDiaCSV(' + gIdx + ')">⬇️ CSV</button>' +
    '</div>';
    return header + g.orders.map(function(o) { return renderPedidoCard(o); }).join('');
  }).join('');
}

function renderPedidoCard(o) {
  const estadoChip = o.pagado
    ? '<button class="chip pagado" onclick="togglePagado(' + o.num + ')">✅ Pagado</button>'
    : '<button class="chip no-pagado" onclick="togglePagado(' + o.num + ')">❌ No pagado</button>';
  const subChip = (!o.pagado && o.metodo === 'efectivo')
    ? '<button class="chip sub" onclick="toggleSub(' + o.num + ')">' + labelSub(o.sub) + '</button>'
    : '';
  return '<div class="pedido-card">' +
    '<div class="pedido-head">' +
      '<span class="pedido-num">#' + o.num + '</span>' +
      '<span class="pedido-cliente">' + o.cliente + '</span>' +
      '<span class="pedido-hora">' + o.hora + '</span>' +
    '</div>' +
    '<div class="pedido-items">' + o.lines.join('<br>') + '</div>' +
    '<div class="pedido-total">Total: ' + o.total + ' Bs</div>' +
    '<div class="chip-row">' +
      '<span class="chip metodo">' + labelMetodo(o.metodo) + '</span>' +
      estadoChip + subChip +
      '<button class="chip resend" onclick="reenviarWhatsapp(' + o.num + ')">↻ Reenviar WhatsApp</button>' +
    '</div>' +
    '<div class="pedido-actions">' +
      '<button class="action-btn edit" onclick="editarPedido(' + o.num + ')">✏️ Editar</button>' +
      '<button class="action-btn delete" onclick="eliminarPedido(' + o.num + ')">🗑️ Eliminar</button>' +
    '</div>' +
  '</div>';
}
function copiarDia(gIdx) {
  const g = pedidosGroups[gIdx];
  if (!g) return;
  const dayTotal = g.orders.reduce(function(sum, o) { return sum + o.total; }, 0);
  let txt = 'Pedidos del ' + g.fecha + '\n\n';
  g.orders.forEach(function(o) {
    txt += '#' + o.num + ' - ' + o.cliente + ' - ' + o.total + ' Bs - ' + labelMetodo(o.metodo).replace(/^\S+\s/, '') +
      ' - ' + (o.pagado ? 'Pagado' : labelSub(o.sub)) + '\n';
  });
  txt += '\nTotal del día: ' + dayTotal + ' Bs (' + g.orders.length + ' pedidos)';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() { toast('📋 Copiado al portapapeles'); }, function() { toast('⚠️ No se pudo copiar'); });
  } else {
    toast('⚠️ Tu navegador no permite copiar automáticamente');
  }
}
function exportarDiaCSV(gIdx) {
  const g = pedidosGroups[gIdx];
  if (!g) return;
  const csvEscape = function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
  let csv = 'Numero,Cliente,Hora,Items,Total,Metodo,Estado,Subestado\n';
  g.orders.forEach(function(o) {
    csv += [
      o.num, csvEscape(o.cliente), o.hora, csvEscape(o.lines.join(' | ')), o.total,
      labelMetodo(o.metodo).replace(/^\S+\s/, ''),
      o.pagado ? 'Pagado' : 'No pagado',
      o.sub ? labelSub(o.sub) : ''
    ].join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pedidos_' + g.fecha.replace(/\//g, '-') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('⬇️ CSV descargado');
}
function editarPedido(num) {
  const o = pedidos.find(function(p) { return p.num === num; });
  if (!o) return;
  if (!o.cart) { toast('⚠️ Este pedido es de una versión anterior y no se puede editar'); return; }
  editingNum = num;
  cart = Object.assign({}, o.cart);
  document.getElementById('client-name').value = o.cliente === 'Sin nombre' ? '' : o.cliente;
  payState = { metodo: o.metodo, pagado: o.pagado, sub: o.sub || 'falta_pagar' };
  renderPayState();
  updateCart();
  document.getElementById('send-btn').textContent = '💾 Guardar cambios';
  const banner = document.getElementById('editing-banner');
  banner.innerHTML = '✏️ Editando pedido #' + num + ' &nbsp;<a href="#" onclick="salirModoEdicion();return false;" style="color:#fff;text-decoration:underline;">Cancelar</a>';
  banner.style.display = 'block';
  showView('nuevo');
}
function salirModoEdicion() {
  editingNum = null;
  cart = {};
  document.getElementById('client-name').value = '';
  resetPayState();
  document.getElementById('send-btn').textContent = '✉️ Enviar pedido';
  document.getElementById('editing-banner').style.display = 'none';
  updateCart();
}
function eliminarPedido(num) {
  if (!window.confirm('¿Eliminar el pedido #' + num + '? Esta acción no se puede deshacer.')) return;
  pedidos = pedidos.filter(function(p) { return p.num !== num; });
  savePedidos();
  renderPedidos();
  callSheet(new URLSearchParams({ action: 'eliminarPedido', pedido: num }));
  toast('🗑️ Pedido #' + num + ' eliminado');
}
function reenviarWhatsapp(num) {
  const o = pedidos.find(function(p) { return p.num === num; });
  if (!o) return;
  const waText =
    '*Pedido #' + o.num + '*\n' +
    'Cliente: ' + o.cliente + '\n' +
    o.lines.join('\n') + '\n' +
    'Total: ' + o.total + ' Bs';
  window.open('https://wa.me/?text=' + encodeURIComponent(waText), '_blank');
}
function togglePagado(num) {
  const o = pedidos.find(function(p) { return p.num === num; });
  if (!o) return;
  o.pagado = !o.pagado;
  if (o.pagado) o.sub = null; else if (o.metodo === 'efectivo') o.sub = o.sub || 'falta_pagar';
  savePedidos(); renderPedidos();
  updatePagoInSheet(o.num, o.pagado, o.sub);
}
function toggleSub(num) {
  const o = pedidos.find(function(p) { return p.num === num; });
  if (!o) return;
  o.sub = o.sub === 'falta_pagar' ? 'falta_cambio' : 'falta_pagar';
  savePedidos(); renderPedidos();
  updatePagoInSheet(o.num, o.pagado, o.sub);
}
function renderMenuAdmin() {
  const list = document.getElementById('menu-admin-list');
  const items = getAllProducts();
  const isCustom = function(id) { return customProducts.some(c => c.id === id); };
  list.innerHTML = items.map(function(p) {
    const on = isActivo(p.id);
    return '<div class="pedido-card">' +
      '<div class="pedido-head">' +
        '<span class="p-icon" style="margin-right:6px;">' + (p.icon || '🍽️') + '</span>' +
        '<span class="pedido-cliente">' + p.name + (p.desc ? ' — ' + p.desc : '') + '</span>' +
        '<span class="pedido-hora">' + p.price + ' Bs</span>' +
      '</div>' +
      '<button class="action-btn ' + (on ? 'edit' : 'delete') + '" style="width:100%;margin-bottom:6px;" onclick="toggleActivo(\'' + p.id + '\')">' +
        (on ? '✅ Activo hoy (tocar para ocultar)' : '⭕ Oculto hoy (tocar para activar)') +
      '</button>' +
      '<div class="pedido-actions">' +
        '<button class="action-btn edit" onclick="abrirFormProducto(\'' + p.id + '\')">✏️ Editar</button>' +
        (isCustom(p.id) ? '<button class="action-btn delete" onclick="eliminarProductoCustom(\'' + p.id + '\')">🗑️ Eliminar</button>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}
function toggleActivo(id) {
  const idx = activos.indexOf(id);
  if (idx === -1) { activos.push(id); } else { activos.splice(idx, 1); if (cart[id]) { delete cart[id]; updateCart(); } }
  saveActivos();
  renderMenuAdmin();
  renderMenu();
}
function setActivosBulk(todos) {
  activos = [];
  if (todos) { getAllProducts().forEach(p => activos.push(p.id)); }
  else { cart = {}; updateCart(); }
  saveActivos();
  renderMenuAdmin();
  renderMenu();
}
let editandoProductoId = null;
function poblarSelectCategorias() {
  const sel = document.getElementById('pf-cat');
  sel.innerHTML = CATEGORIAS.map(function(c) { return '<option value="' + c.key + '">' + c.label + '</option>'; }).join('');
}
function abrirFormProducto(id) {
  poblarSelectCategorias();
  const form = document.getElementById('product-form');
  if (id) {
    const p = getAllProducts().find(x => x.id === id);
    if (!p) return;
    editandoProductoId = id;
    document.getElementById('product-form-title').textContent = 'Editar: ' + p.name;
    document.getElementById('pf-nombre').value = p.name || '';
    document.getElementById('pf-desc').value = p.desc || '';
    document.getElementById('pf-precio').value = p.price;
    document.getElementById('pf-cat').value = p.cat || 'comidas';
    document.getElementById('pf-icono').value = p.icon || '';
  } else {
    editandoProductoId = null;
    document.getElementById('product-form-title').textContent = 'Nuevo producto';
    document.getElementById('pf-nombre').value = '';
    document.getElementById('pf-desc').value = '';
    document.getElementById('pf-precio').value = '';
    document.getElementById('pf-cat').value = 'comidas';
    document.getElementById('pf-icono').value = '';
  }
  form.style.display = 'flex';
}
function cerrarFormProducto() {
  document.getElementById('product-form').style.display = 'none';
  editandoProductoId = null;
}
function guardarProducto() {
  const nombre = document.getElementById('pf-nombre').value.trim();
  const desc = document.getElementById('pf-desc').value.trim();
  const precio = parseFloat(document.getElementById('pf-precio').value);
  const cat = document.getElementById('pf-cat').value;
  const icono = document.getElementById('pf-icono').value.trim();
  if (!nombre) { toast('⚠️ Escribe un nombre para el producto'); return; }
  if (isNaN(precio) || precio < 0) { toast('⚠️ Escribe un precio válido'); return; }
  const wa = (icono ? icono + ' ' : '') + nombre + (desc ? ' (' + desc + ')' : '');

  if (editandoProductoId) {
    const esBase = MENU.menu.some(p => p.id === editandoProductoId);
    if (esBase) {
      productOverrides[editandoProductoId] = { name: nombre, desc: desc, price: precio, cat: cat, icon: icono, wa: wa };
      saveOverrides();
    } else {
      const idx = customProducts.findIndex(p => p.id === editandoProductoId);
      if (idx !== -1) customProducts[idx] = Object.assign({}, customProducts[idx], { name: nombre, desc: desc, price: precio, cat: cat, icon: icono, wa: wa });
      saveCustomProducts();
    }
    toast('✅ Producto actualizado');
  } else {
    const id = 'custom_' + Date.now();
    customProducts.push({ id: id, name: nombre, desc: desc, price: precio, cat: cat, icon: icono, wa: wa });
    saveCustomProducts();
    activos.push(id);
    saveActivos();
    toast('✅ Producto agregado y activado para hoy');
  }
  cerrarFormProducto();
  renderMenuAdmin();
  renderMenu();
}
function eliminarProductoCustom(id) {
  if (!window.confirm('¿Eliminar este producto por completo? Esta acción no se puede deshacer.')) return;
  customProducts = customProducts.filter(p => p.id !== id);
  saveCustomProducts();
  const idx = activos.indexOf(id);
  if (idx !== -1) { activos.splice(idx, 1); saveActivos(); }
  if (cart[id]) { delete cart[id]; updateCart(); }
  renderMenuAdmin();
  renderMenu();
}
function setupMenuAdmin() {
  document.getElementById('menu-todos').addEventListener('click', function() { setActivosBulk(true); });
  document.getElementById('menu-ninguno').addEventListener('click', function() { setActivosBulk(false); });
  document.getElementById('agregar-producto-btn').addEventListener('click', function() { abrirFormProducto(null); });
  document.getElementById('pf-cancelar').addEventListener('click', cerrarFormProducto);
  document.getElementById('pf-guardar').addEventListener('click', guardarProducto);
}
setupMenuAdmin();
function setupTabs() {
  document.getElementById('tab-nuevo').addEventListener('click', function() { showView('nuevo'); });
  document.getElementById('tab-pedidos').addEventListener('click', function() { showView('pedidos'); });
  document.getElementById('tab-menu').addEventListener('click', function() { showView('menu'); });
}
function setupPedidosToolbar() {
  document.getElementById('pedidos-search').addEventListener('input', function(e) {
    pedidosSearch = e.target.value;
    renderPedidos();
  });
  document.querySelectorAll('.filter-chip').forEach(function(btn) {
    btn.addEventListener('click', function() {
      pedidosFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-chip').forEach(function(b) { b.classList.toggle('active', b === btn); });
      renderPedidos();
    });
  });
  document.getElementById('cerrar-dia-btn').addEventListener('click', cerrarDiaEnSheet);
}
setupPedidosToolbar();
function showView(view) {
  document.getElementById('view-nuevo').style.display = view === 'nuevo' ? 'flex' : 'none';
  document.getElementById('view-pedidos').style.display = view === 'pedidos' ? 'flex' : 'none';
  document.getElementById('view-menu').style.display = view === 'menu' ? 'flex' : 'none';
  document.getElementById('tab-nuevo').classList.toggle('active', view === 'nuevo');
  document.getElementById('tab-pedidos').classList.toggle('active', view === 'pedidos');
  document.getElementById('tab-menu').classList.toggle('active', view === 'menu');
  if (view === 'pedidos') renderPedidos();
  if (view === 'menu') renderMenuAdmin();
}
setupTabs();

window.addEventListener('beforeunload', function(e) {
  if (Object.keys(cart).length > 0) {
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function setupCounterReset() {
  const el = document.getElementById('change-num-btn');
  el.addEventListener('click', function() {
    const input = window.prompt('¿Desde qué número quieres retomar los pedidos?', counter);
    if (input === null) return;
    const n = parseInt(input, 10);
    if (!isNaN(n) && n > 0) {
      counter = n;
      localStorage.setItem('sh82_counter', counter);
      toast('🔢 Número de pedido ajustado a #' + counter);
    } else {
      toast('⚠️ Número no válido');
    }
  });
}
setupCounterReset();
renderMenu();
</script>
</body>
